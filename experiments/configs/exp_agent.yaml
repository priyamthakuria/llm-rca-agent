experiment_id: "E4_agent"
mode: "agent"
model:
  backend: "openai"
  model_name: "gpt-4"
  temperature: 0.0
  max_tokens: 1024

tools:
  enabled: true
  anomaly_threshold: 2.0
  top_k_metrics: 3

prompt:
  template: "agent"

data:
  test_set_path: "data/synthetic"
  test_split_ratio: 0.2

output:
  results_dir: "experiments/results"
  save_predictions: true

seed: 42

