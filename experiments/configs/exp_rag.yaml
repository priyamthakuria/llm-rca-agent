experiment_id: "E3_rag"
mode: "rag"
model:
  backend: "openai"
  model_name: "gpt-4"
  temperature: 0.0
  max_tokens: 512

embedding:
  model_name: "all-MiniLM-L6-v2"

retrieval:
  top_k: 5
  knowledge_base_path: "data/knowledge_base.json"

prompt:
  template: "rag"

data:
  test_set_path: "data/synthetic"
  test_split_ratio: 0.2

output:
  results_dir: "experiments/results"
  save_predictions: true

seed: 42

